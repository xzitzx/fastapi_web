{% extends 'blog/base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">用户登录</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">用户名</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>
        <p class="mt-3 text-center">还没有账号？<a href="{% url 'register' %}">点击注册</a></p>
    </div>
</div>
<style> input { display: block; width: 100%; padding: .375rem .75rem; border: 1px solid #ced4da; border-radius: .25rem; } </style>
{% endblock %}
